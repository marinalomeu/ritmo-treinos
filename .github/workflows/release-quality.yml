name: Release quality gate
on:
  pull_request:
  push:
    branches:
      - feat/multiusuario-convites

permissions:
  contents: read

jobs:
  typecheck-build-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (repository has no package-lock.json)
        run: npm install --no-audit --no-fund --no-package-lock
      - name: TypeScript
        run: npm run typecheck
      - name: Security and regression contracts
        run: node --experimental-strip-types --test tests/security-contract.test.mjs tests/goal.test.mjs tests/workout-share.test.mjs tests/whoop-foundation.test.mjs tests/approved-improvements.test.mjs
      - name: Production build without deployment
        run: npm run build
